<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Program Evaluasi Nilai</h2>

    <script>
      // input nilai
      let nilai = parseInt(prompt("Masukkan nilai (0 - 100):"));

      // pengecekan nilai
      if (nilai >= 0 && nilai <= 20) {
        document.write("Nilai Huruf: E");
      } else if (nilai >= 21 && nilai <= 39) {
        document.write("Nilai Huruf: D");
      } else if (nilai >= 40 && nilai <= 64) {
        document.write("Nilai Huruf: C");
      } else if (nilai >= 65 && nilai <= 79) {
        document.write("Nilai Huruf: B");
      } else if (nilai >= 80 && nilai <= 100) {
        document.write("Nilai Huruf: A");
      } else {
        document.write("Nilai tidak valid!");
      }
    </script>
  </body>
</html>
